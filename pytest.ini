[pytest]
testpaths = tests
markers =
    politica: camada 1 — allowlist, bloqueio e invariante que não depende de resposta. Offline.
    contrato: camada 2 — forma da requisição e da resposta, contra fixture versionada. Offline.
    live: camada 3 — fala com a USP de verdade. Só com USP_MCP_LIVE=1.
pythonpath = .
addopts = -q --strict-markers --continue-on-collection-errors
