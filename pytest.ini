[pytest]
testpaths = tests
markers =
    politica: camada 1 — decisão de allowlist/bloqueio. Offline, sem rede, sem fixture.
    contrato: camada 2 — comportamento contra a fixture higienizada. Offline.
    live: camada 3 — fala com a USP de verdade. Só com USP_MCP_LIVE=1.
pythonpath = .
addopts = -q --strict-markers --continue-on-collection-errors
